  <style>
    :root {
      --bg-dark: #0b0d19;
      --card-bg: rgba(22, 27, 46, 0.85);
      --primary: #00d2ff;
      --accent: #3a7bd5;
      --text: #ffffff;
      --text-muted: #a0aec0;
      --success: #27ae60;
      --danger: #e74c3c;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: radial-gradient(circle at center, #1a1f3c 0%, var(--bg-dark) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 950px; }
    h1 { font-size: 2.2rem; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
    p.subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 5px; }

    /* Barra de Progreso */
    .progress-container {
      width: 100%; max-width: 950px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px; padding: 15px; margin-bottom: 30px;
      border: 1px solid var(--border); backdrop-filter: blur(5px);
    }
    .progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
    .bar-bg { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.4s ease; }

    /* Módulos Grid */
    .modules-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px; width: 100%; max-width: 950px;
    }
    .module-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .module-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .module-card.locked { opacity: 0.5; filter: grayscale(80%); pointer-events: none; }
    .module-card.completed { border-color: var(--success); }

    .card-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .card-tag { font-size: 0.75rem; background: rgba(0, 210, 255, 0.15); color: var(--primary); padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; font-weight: bold; }
    .card-title { font-size: 1.1rem; margin-bottom: 8px; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4; }

    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: white; font-weight: bold; cursor: pointer; transition: opacity 0.2s ease;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid var(--border); }
    .btn-reset { background: rgba(231, 76, 60, 0.2); color: #e74c3c; margin-top: 20px; width: auto; padding: 8px 16px; }

    /* Modal Espacioso */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: #161b2e; border: 1px solid var(--primary); border-radius: 12px;
      max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 25px; position: relative;
    }
    .close-btn { position: absolute; top: 15px; right: 15px; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; }

    /* Tabs dentro del Modal */
    .tab-container { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .tab-btn { background: none; border: none; color: var(--text-muted); font-weight: bold; padding: 8px 16px; cursor: pointer; border-radius: 6px; }
    .tab-btn.active { color: var(--primary); background: rgba(0, 210, 255, 0.1); }
    .tab-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .scroll-container {
      max-height: 380px; overflow-y: auto; padding: 15px;
      border: 1px solid var(--border); border-radius: 8px; background: rgba(0, 0, 0, 0.2);
    }

    .media-box { width: 100%; margin: 10px 0; border-radius: 8px; overflow: hidden; background: #000; }
    .media-box iframe { width: 100%; height: 315px; border: none; }
    .media-box img { width: 100%; height: auto; display: block; }

    /* Quiz Styling */
    .question-block { margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
    .question-title { font-weight: bold; font-size: 1rem; margin-bottom: 10px; color: var(--primary); }
    .quiz-option { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; border: 1px solid var(--border); font-size: 0.9rem; }
    .quiz-option:hover { border-color: var(--primary); }
    .quiz-option.selected { border-color: var(--primary); background: rgba(0, 210, 255, 0.15); }

    .alert-banner {
      background: rgba(231, 76, 60, 0.2); border: 1px solid var(--danger);
      color: #ff8e8e; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem;

    const STORAGE_KEY = "EDX_GO_PROGRESS_V5";
    let userProgress = { completedModules: [], studentName: "", attempts: {}, viewedContent: {} };
    let ytPlayer = null;

    function loadProgress() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { userProgress = JSON.parse(saved); } catch (e) { console.error(e); }
      }
      if (!userProgress.attempts) userProgress.attempts = {};
      if (!userProgress.viewedContent) userProgress.viewedContent = {};
      renderModules();
      updateProgressBar();
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userProgress));
      updateProgressBar();
    }

    function resetProgress() {
      if (confirm("¿Deseas reiniciar todo tu progreso guardado?")) {
        localStorage.removeItem(STORAGE_KEY);
        userProgress = { completedModules: [], studentName: "", attempts: {}, viewedContent: {} };
        renderModules();
        updateProgressBar();
      }
    }

    function updateProgressBar() {
      const percent = Math.round((userProgress.completedModules.length / MODULES.length) * 100);
      document.getElementById("progress-bar").style.width = `${percent}%`;
      document.getElementById("progress-text").innerText = `${percent}% Completado`;
    }

    function renderModules() {
      const grid = document.getElementById("modules-grid");
      grid.innerHTML = "";

      MODULES.forEach((mod, index) => {
        const isCompleted = userProgress.completedModules.includes(mod.id);
        const isUnlocked = index === 0 || userProgress.completedModules.includes(MODULES[index - 1].id);

        const card = document.createElement("div");
        card.className = `module-card ${isCompleted ? 'completed' : ''} ${!isUnlocked ? 'locked' : ''}`;
        
        card.innerHTML = `
          <div class="card-icon">${mod.icon}</div>
          <span class="card-tag">${mod.tag}</span>
          <h3 class="card-title">${mod.name}</h3>
          <p class="card-desc">${mod.description}</p>
          <button class="btn" onclick="openModule('${mod.id}')">
            ${isCompleted ? 'Repasar Módulo' : 'Entrar al Módulo'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    let activeModuleId = null;
    let selectedAnswers = {};

    function openModule(modId) {
      activeModuleId = modId;
      selectedAnswers = {};
      const mod = MODULES.find(m => m.id === modId);
      const body = document.getElementById("modal-body");

      if (modId === "m8") {
        // Examen Final (12 Preguntas con Reintentos Libres)
        body.innerHTML = `
          <h2>${mod.icon} ${mod.name}</h2>
          <p style="margin-bottom:15px; color:var(--text-muted)">Evaluación Integral de la Ruta (12 Preguntas). Completa tus datos e ingresa tus respuestas:</p>
          <input type="text" id="student-name-input" placeholder="Nombre Completo del Estudiante" value="${userProgress.studentName || ''}" style="width:100%; padding:10px; margin-bottom:20px; border-radius:6px; border:1px solid var(--border); background:#0b0d19; color:#fff;">
          
          <div class="scroll-container" style="max-height:450px;">
            ${mod.finalExam.map((q, qIdx) => `
              <div class="question-block">
                <p class="question-title">${q.q}</p>${q.opts.map((opt, oIdx) => `
                  <div class="quiz-option" onclick="selectExamOption(${qIdx}, ${oIdx}, this)">
                    ${opt}
                  </div>
                `).join('')}
              </div>
            `).join('')}
          </div>

          <button class="btn" id="btn-submit-final-exam" style="margin-top:15px;" onclick="validateFinalExam()">Entregar Examen y Finalizar Ruta</button>
        `;
      } else {
        const attemptsUsed = userProgress.attempts[modId] || 0;
        const isViewed = userProgress.viewedContent[modId] || false;

        body.innerHTML = `
          <h2>${mod.icon} ${mod.name}</h2>
          
          <div class="tab-container">
            <button class="tab-btn active" id="tab-btn-content" onclick="switchTab('content')">1. Contenido</button>
            <button class="tab-btn" id="tab-btn-quiz" ${!isViewed ? 'disabled' : ''} onclick="switchTab('quiz')">
              2. Quiz del Módulo (5 Preguntas) ${isViewed ? '🔓' : '🔒'}
            </button>
          </div>

          <div id="tab-content">
            ${!isViewed ? '<div class="alert-banner">🔒 Debes revisar el contenido/video completo para habilitar el Quiz.</div>' : ''}
            <p style="color:var(--text-muted); margin-bottom:10px;">${mod.contentInfo}</p>
            
            <div class="scroll-container" id="media-scroll-box" onscroll="handleScrollCheck('${mod.id}')">
              ${renderMediaBox(mod)}
            </div>

            ${mod.contentType === 'text' && !isViewed ? `
              <button class="btn" style="margin-top:15px;" onclick="unlockModuleContent('${mod.id}')">He leído todo el material ✓</button>
            ` : ''}

            <button class="btn" id="btn-go-quiz" style="margin-top:15px;" ${!isViewed ? 'disabled' : ''} onclick="switchTab('quiz')">
              ${isViewed ? 'Ir al Quiz del Módulo →' : 'Completa el contenido para habilitar el Quiz'}
            </button>
          </div>

          <div id="tab-quiz" style="display:none;">
            <p style="color:var(--text-muted); margin-bottom:10px; font-size:0.85rem;">
              Intentos fallidos en este ciclo: <strong style="color:var(--primary);">${attemptsUsed} / 2</strong> (Margen permitido: máximo 1 error).
            </p>
            
            <div class="scroll-container" style="max-height:400px;">
              ${mod.quiz.map((q, qIdx) => `
                <div class="question-block">
                  <p class="question-title">${qIdx + 1}. ${q.q}</p>${q.opts.map((opt, oIdx) => `
                    <div class="quiz-option" onclick="selectQuizOption(${qIdx}, ${oIdx}, this)">
                      ${opt}
                    </div>
                  `).join('')}
                </div>
              `).join('')}
            </div>

            <button id="btn-submit-mod-quiz" class="btn" style="margin-top:15px;" onclick="validateModuleQuiz('${mod.id}')">Validar Respuestas y Completar</button>
          </div>
        `;

        if (mod.contentType === "video") {
          setTimeout(() => initYouTubePlayer(mod.youtubeId, mod.id), 300);
        }
      }

      document.getElementById("modal").style.display = "flex";
    }

    function renderMediaBox(mod) {
      if (mod.contentType === "video") {
        return `<div class="media-box"><div id="yt-player-container"></div></div>`;
      } else if (mod.contentType === "image") {
        return `<div class="media-box"><img id="module-img" src="${mod.contentUrl}" alt="Infografía del módulo"></div>`;
      } else {
        return `<div style="padding:10px;">${mod.contentInfo}</div>`;
      }
    }

    function initYouTubePlayer(videoId, modId) {
      if (typeof YT !== 'undefined' && YT.Player) {
        ytPlayer = new YT.Player('yt-player-container', {
          height: '315', width: '100%', videoId: videoId,
          events: {
            'onStateChange': function(event) {
              if (event.data === YT.PlayerState.ENDED) {
                alert("¡Has terminado de ver el video! El Quiz del módulo ha sido desbloqueado.");
                unlockModuleContent(modId);
              }
            }
          }
        });
      }
    }

    function handleScrollCheck(modId) {
      const mod = MODULES.find(m => m.id === modId);
      if (mod.contentType !== "image") return;

      const container = document.getElementById("media-scroll-box");
      if (container.scrollTop + container.clientHeight >= container.scrollHeight - 30) {
        if (!userProgress.viewedContent[modId]) {
          alert("¡Has revisado todo el material! El Quiz ha sido desbloqueado.");
          unlockModuleContent(modId);
        }
      }
    }

    function unlockModuleContent(modId) {
      userProgress.viewedContent[modId] = true;
      saveProgress();

      const quizTabBtn = document.getElementById("tab-btn-quiz");
      const goQuizBtn = document.getElementById("btn-go-quiz");

      if (quizTabBtn) { quizTabBtn.disabled = false; quizTabBtn.innerText = "2. Quiz del Módulo (5 Preguntas) 🔓"; }
      if (goQuizBtn) { goQuizBtn.disabled = false; goQuizBtn.innerText = "Ir al Quiz del Módulo →"; }
    }

    function switchTab(tabName) {
      const contentDiv = document.getElementById("tab-content");
      const quizDiv = document.getElementById("tab-quiz");
      const btnContent = document.getElementById("tab-btn-content");
      const btnQuiz = document.getElementById("tab-btn-quiz");

      if (tabName === 'content') {
        contentDiv.style.display = "block"; quizDiv.style.display = "none";
        btnContent.classList.add("active"); btnQuiz.classList.remove("active");
      } else {
        contentDiv.style.display = "none"; quizDiv.style.display = "block";
        btnContent.classList.remove("active"); btnQuiz.classList.add("active");
      }
    }

    function selectQuizOption(qIdx, oIdx, element) {
      selectedAnswers[qIdx] = oIdx;
      const parent = element.parentElement;
      parent.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');
    }

    function selectExamOption(qIdx, oIdx, element) {
      selectedAnswers[qIdx] = oIdx;
      const parent = element.parentElement;
      parent.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');
    }

    /* Validar Quiz de Módulo (5 preguntas - Permite hasta 1 error) */
    function validateModuleQuiz(modId) {
      const mod = MODULES.find(m => m.id === modId);
      
      if (Object.keys(selectedAnswers).length < mod.quiz.length) {
        alert("Por favor responde las 5 preguntas del quiz.");
        return;
      }

      let correctCount = 0;
      mod.quiz.forEach((q, idx) => {
        if (selectedAnswers[idx] === q.correct) correctCount++;
      });

      if (!userProgress.attempts[modId]) userProgress.attempts[modId] = 0;

      // Aprobación con margen de error (mínimo 4 correctas de 5)
      if (correctCount >= 4) {
        userProgress.attempts[modId] = 0;
        alert(`¡Felicidades! 🎉 Respondiste correctamente ${correctCount}/5 preguntas. Módulo aprobado.`);
        if (!userProgress.completedModules.includes(modId)) {
          userProgress.completedModules.push(modId);
        }
        saveProgress();
        renderModules();
        closeModal();
      } else {
        userProgress.attempts[modId] += 1;
        saveProgress();

        if (userProgress.attempts[modId] >= 2) {
          userProgress.attempts[modId] = 0;
          userProgress.viewedContent[modId] = false;
          userProgress.completedModules = userProgress.completedModules.filter(id => id !== modId);
          saveProgress();
          renderModules();

          alert(`❌ Tuviste ${correctCount}/5 aciertos. Has fallado 2 veces consecutivas. Debes volver a repasar el contenido completo para intentar nuevamente.`);
          openModule(modId);
          switchTab('content');
        } else {
          alert(`❌ Obtuviste ${correctCount}/5 aciertos (se requieren mínimo 4). Te queda 1 intento antes de tener que repetir la lección.`);
          openModule(modId);
          switchTab('quiz');
        }
      }
    }

    /* Validar Examen Final (12 preguntas - Intento Libre) */
    function validateFinalExam() {
      const mod = MODULES.find(m => m.id === "m8");
      const nameInput = document.getElementById("student-name-input").value.trim();

      if (!nameInput) { alert("Ingresa tu nombre completo."); return; }
      if (Object.keys(selectedAnswers).length < mod.finalExam.length) {
        alert("Por favor responde las 12 preguntas del examen final.");
        return;
      }

      userProgress.studentName = nameInput;

      let correctCount = 0;
      mod.finalExam.forEach((q, idx) => {
        if (selectedAnswers[idx] === q.correct) correctCount++;
      });

      const scorePercent = Math.round((correctCount / 12) * 100);

      if (scorePercent >= 80) { // Aprueba con 80% o más
        if (!userProgress.completedModules.includes("m8")) {
          userProgress.completedModules.push("m8");
        }
        saveProgress();
        renderModules();

        const body = document.getElementById("modal-body");
        body.innerHTML = `
          <h2>🎉 ¡Felicitaciones, ${userProgress.studentName}!</h2>
          <p style="margin:15px 0; color:var(--text-muted)">Aprobaste el Examen Final con un puntaje de <strong>${scorePercent}% (${correctCount}/12)</strong>.</p>
          <button class="btn" style="margin-bottom:10px;" onclick="downloadPDF()">Descargar Certificado PDF</button>
          <button class="btn btn-secondary" onclick="downloadExcel()">Descargar Reporte Excel</button>
        `;
      } else {
        alert(`❌ Obtuviste ${correctCount}/12 aciertos (${scorePercent}%). Se requiere un mínimo del 80% para certificarte.\n\nPuedes volver a intentar la evaluación inmediatamente.`);
        openModule("m8"); // Permite reintento libre de las 12 preguntas
      }
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
      if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy();
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape' });

      doc.setFillColor(11, 13, 25);
      doc.rect(0, 0, 297, 210, 'F');

      doc.setDrawColor(0, 210, 255);
      doc.setLineWidth(2);
      doc.rect(10, 10, 277, 190);

      doc.setTextColor(0, 210, 255);
      doc.setFontSize(26);
      doc.text("CERTIFICADO DE APROBACIÓN", 148, 45, { align: "center" });

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(14);
      doc.text("Otorgado a:", 148, 75, { align: "center" });

      doc.setFontSize(22);
      doc.setTextColor(0, 210, 255);
      doc.text(userProgress.studentName.toUpperCase(), 148, 95, { align: "center" });

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(13);
      doc.text("Por completar la Ruta de Capacitación en Excelencia de la Experiencia", 148, 120, { align: "center" });
      doc.text("Duración: 24 Horas Académicas | Estado: Aprobado", 148, 135, { align: "center" });

      doc.save(`Certificado_EDX_GO_${userProgress.studentName.replace(/\s+/g, '_')}.pdf`);
    }

    function downloadExcel() {
      const data = [
        ["Nombre del Estudiante", "Curso", "Horas", "Estado", "Fecha"],
        [userProgress.studentName, "EDX GO - Ruta de Excelencia", 24, "Aprobado", new Date().toLocaleDateString()]
      ];

      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Resultados");
      XLSX.writeFile(wb, `Reporte_EDX_GO_${userProgress.studentName.replace(/\s+/g, '_')}.xlsx`);
    }

    document.addEventListener("DOMContentLoaded", loadProgress);
  </script>
</body>
</html>
